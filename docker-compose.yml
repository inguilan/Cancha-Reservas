services:
  db:
    image: postgres:16-alpine
    container_name: cancha_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cancha_db}
      POSTGRES_USER: ${POSTGRES_USER:-cancha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cancha_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cancha_user} -d ${POSTGRES_DB:-cancha_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cancha_backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cancha_frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: cancha_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
